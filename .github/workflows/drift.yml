name: drift

# The one thing this repository cannot test offline: whether the page it parses still looks like the page it
# saved. `scripts/fixture-refresh.mjs` re-fetches the same three queries through the provider's own request
# and compares what parses now with what the stored fixture holds. Fewer sources than stored is drift, and
# drift breaks a user before it breaks a test — the stored pages are the only part of this bundle that
# depends on someone else's markup.
#
# Weekly, and on demand. A failure here is a prompt to run the script locally with `--write` after reading
# the difference, not a signal that the endpoint is down: an unreachable page and a changed page read
# differently in the output (`fetch failed` versus `3 sources, stored 10`), which is why the step prints the
# per-fixture counts before it exits.

on:
  schedule:
    # Monday 03:17 UTC — 11:17 in Asia/Shanghai, far enough from the top of the hour that a runner is free.
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Re-fetch the fixtures and compare
        # `--via www.bing.com` for one measured reason: a GitHub runner sits outside the endpoint's region,
        # and `cn.bing.com` answers it `301 → https://www.bing.com/?q=…` (run 43567692402), which the
        # provider refuses by design. The flag rewrites the request host inside the script so the parser is
        # still exercised against real Bing markup every week; the CN endpoint itself is what a local run,
        # with no flag, checks.
        #
        # The criterion changes with the host, because the result set does: the same three queries return
        # 10 / 7 / 8 sources from `www.bing.com` against 10 / 10 / 10 from `cn.bing.com` (run 43567858764).
        # So this step fails only when a fixture parses under a structural floor of five sources — the
        # parser losing the page is the drift worth a red ✗, a smaller regional result set is not.
        #
        # No `npm install`: this reads `bing.js`, which imports nothing.
        run: node scripts/fixture-refresh.mjs --via www.bing.com
