name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24: Node 22 documents this flag as `--experimental-test-isolation`, and the local runner
          # is Node 24. Pinning the same major keeps "passes locally" and "green in CI" the same statement.
          node-version: "24"

      - name: Modules parse as ESM
        # One line naming every published module, because a second line is a line that can be forgotten:
        # this step said `index.js` and `bing.js` for a version after `article.js` shipped.
        run: node --check index.js bing.js article.js

      - name: Resolve the seam for the entry tests
        # index.js imports @deepseek-ai/dsh-web, which a linked bundle receives from the runtime as a
        # declared peer. The entry tests load the real class instead of a stand-in, so CI installs it —
        # the bundle itself installs nothing at runtime, and no other test needs it. Without this step
        # those tests skip, which `scripts/check.mjs` refuses.
        run: npm install --no-save --no-package-lock @deepseek-ai/dsh-web

      - name: Unit tests
        # One process on purpose: the tests stub `globalThis.fetch` and read saved fixtures, so process
        # isolation would add nothing and this machine's sandbox refuses the spawn it costs.
        run: node --test --test-isolation=none tests/*.test.mjs

      - name: Mutation scan
        # Breaks one load-bearing line of bing.js at a time and requires the suite to fail: a test that
        # cannot fail is decoration. A survivor means no test stands behind that line.
        run: node scripts/mutation-scan.mjs

      - name: Repository checks
        # Offline: the request-layer regressions run against the saved fixture, never the network.
        run: node scripts/check.mjs
