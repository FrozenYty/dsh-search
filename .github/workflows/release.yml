name: release

# A tag is the only thing that publishes a release, and a release is the one install route that needs
# neither the npm registry nor GitHub at install time: the attached tarball is the bundle.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: The tag names this version
        # A v0.1.3 tag on a 0.1.2 manifest would publish a tarball whose version nobody tagged.
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Repository checks
        run: node scripts/check.mjs

      - name: Resolve the seam for the entry tests
        # The same step `ci` runs: the entry tests load the real @deepseek-ai/dsh-web, and a release is
        # only published when the same gate runs here.
        run: npm install --no-save --no-package-lock @deepseek-ai/dsh-web

      - name: Unit tests
        run: node --test --test-isolation=none tests/*.test.mjs

      - name: Mutation scan
        run: node scripts/mutation-scan.mjs

      - name: Build the package tarball
        run: node scripts/pack.mjs dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tgz dist/SHA256SUMS.txt \
            --title "$GITHUB_REF_NAME" \
            --notes "The bundle for $GITHUB_REF_NAME. Install it with \`dsh plugin --profile <profile> add <path to the .tgz>\`, or link this repository directly — see README.md. What changed is in CHANGELOG.md."
