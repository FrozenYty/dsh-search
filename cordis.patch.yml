# dsh-search bundle patch.
#
# 1. Point the web seam's two halves at this bundle.
#
#    Search: the shipped base bundle pins `searchProvider: deepseek-official`, whose search is an auxiliary
#    Messages call against api.deepseek.com. An account with no balance answers that call with HTTP 402,
#    so `web_search` fails while chat keeps working. The pin is what decides, so registering a second
#    provider alone changes nothing: this row override is the entry that makes the bundle take effect.
#
#    Fetch: the shipped `http` provider returns a page's markup, chrome and all — measured at 61 % chrome
#    and 1.4 % prose on five real pages. This bundle's `article` provider reads the page itself and hands
#    over its text (docs/adr/0010-the-other-half-of-the-result.md).
#
#    `config` is replaced wholesale, never deep-merged, so both fields are restated here — dropping one
#    would send that half back to auto-selection.
- id: web
  config:
    searchProvider: bing-html
    fetchProvider: article

# 2. Insert this bundle's own provider row. The id follows the package name, which is how the rest of the
#    family reads (`dsh-memory` inserts `memory`, `dsh-cleaner` inserts `cleaner`), and it is the id a
#    profile addresses when it overrides this bundle's config (ADR 0007; it was `web-search-bing-html`
#    before 0.2.0).
#
#    `provider` is the owner's choice, and the three values are the whole of this bundle's configuration
#    (docs/adr/0006-choosing-the-search-provider.md):
#
#      keyless   (default) Bing's result page, no account involved
#      official            the shipped DeepSeek provider, on the account and its balance
#      auto                the shipped provider when it can run, otherwise keyless
#
#    A profile changes it by overriding this row in its own cordis.patch.yml:
#
#      - id: search
#        config:
#          provider: official
- insert:
    - id: search
      name: 'dsh-search'
      config:
        provider: keyless
